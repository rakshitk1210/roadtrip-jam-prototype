<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Road Trip Wrapped — Seattle to North Cascades</title>
    <!-- What a shared link shows in iMessage, Slack and the like. -->
    <meta
      name="description"
      content="Your road trip to the North Cascades, wrapped — the stats, the stops and the photos, in a Google Maps prototype."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Road Trip Wrapped — Seattle to North Cascades" />
    <meta
      property="og:description"
      content="Your road trip to the North Cascades, wrapped — the stats, the stops and the photos, in a Google Maps prototype."
    />
    <meta property="og:url" content="https://road-trip-wrapped.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Road Trip Wrapped — Seattle to North Cascades" />
    <meta
      name="twitter:description"
      content="Your road trip to the North Cascades, wrapped — the stats, the stops and the photos, in a Google Maps prototype."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Sans Flex is what the Figma file specifies. It's OFL-licensed and
         on the Fonts CDN as a real variable font, so the axes Figma pins
         (GRAD 0, ROND 0, wdth 100) come through without shipping any files. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:GRAD,ROND,wdth,wght@0,0,100,400..600&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- The typewriter face the souvenir map sets its numbers in, as the Figma
         file specifies. On the Fonts CDN, so nothing ships with the build. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <!-- display=block so icon ligatures never flash their literal names. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!-- The marker-lettering face a Wrapped photo's scrapbook page sets its
         location title in. On the Fonts CDN, so nothing ships with the build. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
